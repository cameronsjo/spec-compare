    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Artificer theme bootstrap — FIRST in <head>, before any CSS. Same
         script as the root site (cameronsjo.github.io) and the blog: it sets
         data-theme before first paint. A first visit is dark and WRITES
         'dark' to the key, because theme.js reads a missing key as 'auto'
         and would otherwise flip a light-OS visitor after load. A stored
         'auto' resolves against the OS here; the old bootstrap wrote the raw
         'auto' string into data-theme. Unrecognised values read as 'auto',
         as in theme.js. The 'artificer.theme' key MUST match theme.js. -->
    <script>
      (function () {
        var KEY = 'artificer.theme';
        var stored = null;
        try {
          stored = localStorage.getItem(KEY);
        } catch (e) {}
        var mode =
          stored === null
            ? 'dark'
            : stored === 'dark' || stored === 'light' || stored === 'auto'
              ? stored
              : 'auto';
        if (stored === null) {
          try {
            localStorage.setItem(KEY, mode);
          } catch (e) {}
        }
        var theme =
          mode === 'auto'
            ? window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : mode;
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
